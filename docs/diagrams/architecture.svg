<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-label="AWS 비용 수집과 월 예산 조회">
<title>AWS 비용 수집과 월 예산 조회</title>
<rect width="100%" height="100%" fill="white"/>
<text x="36" y="64" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#172B46">AWS 비용 수집과 월 예산 조회</text>
<text x="36" y="95" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">현재 구현된 비용 입력 경로와 예산 상태 조회 흐름</text>
<rect x="36" y="140" width="280" height="125" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="56" y="181" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">AWS Cost Explorer</text>
<text x="56" y="215" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">DAILY / SERVICE</text>
<text x="56" y="242" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">금액 문자열, 발생 날짜</text>
<rect x="420" y="130" width="420" height="155" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="440" y="171" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">AWS 수집 서비스</text>
<text x="440" y="205" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">페이지 조회, USD 검증</text>
<text x="440" y="232" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">서비스명 매핑, 날짜별 합산</text>
<text x="440" y="259" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">AwsCostExplorer / ImportService</text>
<rect x="36" y="350" width="280" height="110" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="56" y="391" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">수동 비용 등록 API</text>
<text x="56" y="425" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">POST /api/costs/add-cost</text>
<rect x="420" y="355" width="420" height="130" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="440" y="396" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">CostService</text>
<text x="440" y="430" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">AWS 기록 생성 또는 갱신</text>
<text x="440" y="457" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">수동 비용 저장, 월 비용 집계</text>
<rect x="935" y="345" width="309" height="155" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="955" y="386" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">MySQL</text>
<text x="955" y="420" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">cost_records</text>
<text x="955" y="447" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">monthly_budgets</text>
<text x="955" y="474" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">Flyway / DECIMAL(38,18)</text>
<rect x="36" y="575" width="280" height="110" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="56" y="616" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">예산 상태 조회 API</text>
<text x="56" y="650" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">GET /api/budgets/status</text>
<rect x="420" y="575" width="420" height="110" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="440" y="616" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">BudgetService</text>
<text x="440" y="650" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">월 비용 + 월 예산 → 상태 응답</text>
<polyline points="316,205 420,205" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="420,205 409.0,210.0 409.0,200.0" fill="#2463AA"/>
<polygon points="316,205 327.0,200.0 327.0,210.0" fill="#2463AA"/>
<text x="324" y="182" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#172B46">일별 조회</text>
<polyline points="630,285 630,355" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="630,355 625.0,344.0 635.0,344.0" fill="#2463AA"/>
<text x="650" y="323" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#172B46">합산 결과</text>
<polyline points="316,405 420,405" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="420,405 409.0,410.0 409.0,400.0" fill="#2463AA"/>
<text x="331" y="389" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="400" fill="#172B46">MANUAL</text>
<polyline points="840,405 935,405" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="935,405 924.0,410.0 924.0,400.0" fill="#2463AA"/>
<polygon points="840,405 851.0,400.0 851.0,410.0" fill="#2463AA"/>
<text x="843" y="382" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#172B46">저장 / 조회</text>
<polyline points="316,630 420,630" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="420,630 409.0,635.0 409.0,625.0" fill="#2463AA"/>
<polyline points="630,575 630,485" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="630,485 635.0,496.0 625.0,496.0" fill="#2463AA"/>
<text x="648" y="537" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#172B46">월 비용 집계</text>
<polyline points="840,630 1090,630 1090,500" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="1090,500 1095.0,511.0 1085.0,511.0" fill="#2463AA"/>
<polygon points="840,630 851.0,625.0 851.0,635.0" fill="#2463AA"/>
<text x="912" y="671" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#172B46">월 예산 조회</text>
<text x="36" y="749" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#172B46">현재 월 집계는 Repository에서 기록을 조회한 뒤 Java의 MonthlyCost로 합산합니다.</text>
</svg>