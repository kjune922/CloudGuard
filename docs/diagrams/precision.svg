<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="485" viewBox="0 0 1280 485" role="img" aria-label="외부 응답 변환과 작은 소수 비용 보존">
<title>외부 응답 변환과 작은 소수 비용 보존</title>
<rect width="100%" height="100%" fill="white"/>
<text x="36" y="64" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#172B46">외부 응답 변환과 작은 소수 비용 보존</text>
<g transform="translate(0,-25)">
<rect x="36" y="135" width="340" height="140" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="56" y="176" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">AWS 응답</text>
<text x="56" y="210" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">금액: &quot;0.0000000488&quot;</text>
<text x="56" y="237" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">서비스: AWS 원본 서비스명</text>
<text x="56" y="264" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">통화: USD</text>
<rect x="465" y="125" width="350" height="175" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="485" y="166" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">도메인 변환</text>
<text x="485" y="200" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">금액 → BigDecimal</text>
<text x="485" y="227" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">서비스 → EC2 / RDS / S3 / OTHER</text>
<text x="485" y="254" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">여러 OTHER 항목은 합산</text>
<text x="485" y="281" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">USD 외 통화는 저장 전 거부</text>
<rect x="900" y="135" width="344" height="140" rx="14" fill="#EDF4FC" stroke="#CCD9E8"/>
<text x="920" y="176" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#2463AA">DB 저장</text>
<text x="920" y="210" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">엔티티와 V1 SQL</text>
<text x="920" y="237" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">DECIMAL(38,18)</text>
<text x="920" y="264" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#586B82">0.0000000488 보존</text>
<polyline points="376,205 465,205" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="465,205 454.0,210.0 454.0,200.0" fill="#2463AA"/>
<polyline points="815,205 900,205" fill="none" stroke="#2463AA" stroke-width="3"/>
<polygon points="900,205 889.0,210.0 889.0,200.0" fill="#2463AA"/>
<rect x="36" y="360" width="1208" height="125" rx="14" fill="#F5F9FD" stroke="#CCD9E8"/>
<text x="58" y="401" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="21" font-weight="700" fill="#2463AA">검증 경로</text>
<text x="58" y="444" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#172B46">저장 → flush() → clear() → 재조회 → 동일 금액 확인</text>
</g>
</svg>